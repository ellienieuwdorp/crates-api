      operationId: actions_copyTo_actions_copy_to_crate_id
      parameters:
      - name: crate_id
        in: path
        description: The id of the crate that the tunes belong to
        required: true
        schema:
          type: string
      - name: path
        in: query
        description: the path to copy the audiosources of the tune
        required: false
