      summary: Add a new cover for a tune
      description: Add a new cover for a tune, If tune already has a cover, will remove this cover and add the new one
      operationId: covers_addCoverById_covers_id_add
      parameters:
      - name: id
        in: path
        description: the id of the tune
        required: true
        schema:
          type: string
      - name: path
        in: query
        description: the url of the cover
        required: true
        schema:
          type: string
      - name: replace
        in: query
        description: (true/false) whether to just add to the existing covers (if they exist) or replace (delete then add)
        required: false
        schema:
          type: string
      - name: pictureType
        in: query
        description: 'Optional pictureType as defined here. if not defined ''4'' Cover(Front) is added by default  Picture
          type:  00 Other   01 32x32 pixels ''file icon'' (PNG only)   02 Other file icon   03 Cover (front)    04 Cover (back)   05
          Leaflet page    06 Media (e.g. label side of CD)   07 Lead artist/lead performer/soloist  08 Artist/performer    09
          Conductor    10 Band/Orchestra   11 Composer   12   Lyricist/text writer  13 Recording Location    14 During recording  15
          During performance      16 Movie/video screen capture     17 A bright coloured fish     18 Illustration       19
          Band/artist logotype      20 Publisher/Studio logotype'
        required: false
        schema:
          type: string
      - name: Client-ID
        in: header
        description: The id of the client who requested the invocation of this service
        required: false
        schema:
          type: string
      - name: Callbacks
        in: header
        description: 'The flag to indicate whether or not to send callback via websocket. Allow type: ''CALLBACKS_OFF'' and
          ''CALLBACKS_ON'''
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Add a new cover for a tune
        '400':
          description: Bad request
        '404':
          description: Not found
        '500':
          description: Exception's message
      security:
      - ClientID: []
