      operationId: actions_copyToPathAvailableSpace_actions_copy_to_path_space
      parameters:
      - name: path
        in: query
        description: The destination path that should be evaluated
        required: true
        schema:
          type: string
      - name: crateId
        in: query
        description: Crate ID that is going to be exported (optional)
        required: false
        schema:
          type: string
      - name: conversionProfileId
        in: query
        description: Conversion profile that will be applied to the export (optional)
        required: false
        schema:
          type: string
      responses:
